<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable adaptive clipping -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Scaled content inside safe zone (80% safe zone centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Subtle musical chord sheet lines in background -->
    <g opacity="0.18" stroke="#ffffff" stroke-width="2">
      <line x1="96" y1="120" x2="416" y2="120"/>
      <line x1="96" y1="140" x2="416" y2="140"/>
      <line x1="96" y1="160" x2="416" y2="160"/>
      <line x1="96" y1="180" x2="416" y2="180"/>
      <line x1="96" y1="200" x2="416" y2="200"/>

      <line x1="96" y1="340" x2="416" y2="340"/>
      <line x1="96" y1="360" x2="416" y2="360"/>
      <line x1="96" y1="380" x2="416" y2="380"/>
      <line x1="96" y1="400" x2="416" y2="400"/>
    </g>

    <!-- Central Emblem: Guitar Pick & Songbook / Guitar -->
    <g filter="url(#mShadow)">
      <path d="M 256,76 
               C 340,76 404,136 404,228 
               C 404,310 326,400 268,438 
               C 260,443 252,443 244,438 
               C 186,400 108,310 108,228 
               C 108,136 172,76 256,76 Z" 
            fill="#18181b" stroke="url(#mAccentGrad)" stroke-width="10"/>

      <!-- Soundhole rosette -->
      <circle cx="256" cy="245" r="54" fill="#09090b" stroke="url(#mAccentGrad)" stroke-width="5"/>
      <circle cx="256" cy="245" r="44" fill="#18181b" stroke="#52525b" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="256" cy="245" r="32" fill="#09090b"/>

      <!-- Guitar Neck extending upwards -->
      <rect x="242" y="104" width="28" height="96" fill="#27272a" rx="4"/>
      <!-- Frets -->
      <line x1="242" y1="126" x2="270" y2="126" stroke="#71717a" stroke-width="2"/>
      <line x1="242" y1="148" x2="270" y2="148" stroke="#71717a" stroke-width="2"/>
      <line x1="242" y1="170" x2="270" y2="170" stroke="#71717a" stroke-width="2"/>
      <line x1="242" y1="192" x2="270" y2="192" stroke="#71717a" stroke-width="2"/>

      <!-- Guitar Strings -->
      <line x1="247" y1="104" x2="247" y2="350" stroke="#e4e4e7" stroke-width="2" opacity="0.85"/>
      <line x1="251" y1="104" x2="251" y2="350" stroke="#e4e4e7" stroke-width="1.8" opacity="0.85"/>
      <line x1="255" y1="104" x2="255" y2="350" stroke="#e4e4e7" stroke-width="1.8" opacity="0.85"/>
      <line x1="259" y1="104" x2="259" y2="350" stroke="#e4e4e7" stroke-width="1.8" opacity="0.85"/>
      <line x1="263" y1="104" x2="263" y2="350" stroke="#e4e4e7" stroke-width="2" opacity="0.85"/>

      <!-- Guitar Bridge -->
      <rect x="230" y="344" width="52" height="14" rx="5" fill="url(#mAccentGrad)"/>
      <circle cx="238" cy="351" r="2" fill="#18181b"/>
      <circle cx="245" cy="351" r="2" fill="#18181b"/>
      <circle cx="252" cy="351" r="2" fill="#18181b"/>
      <circle cx="259" cy="351" r="2" fill="#18181b"/>
      <circle cx="266" cy="351" r="2" fill="#18181b"/>
      <circle cx="274" cy="351" r="2" fill="#18181b"/>

      <!-- Musical Notes -->
      <g transform="translate(148, 200) scale(0.75)" fill="url(#mAccentGrad)">
        <circle cx="20" cy="40" r="12"/>
        <rect x="28" y="10" width="4" height="30"/>
        <path d="M 32,10 C 44,12 48,22 48,28 C 42,22 36,22 32,20 Z"/>
      </g>

      <g transform="translate(300, 185) scale(0.75)" fill="url(#mAccentGrad)">
        <ellipse cx="20" cy="42" rx="11" ry="8" transform="rotate(-20 20 42)"/>
        <ellipse cx="50" cy="34" rx="11" ry="8" transform="rotate(-20 50 34)"/>
        <rect x="27" y="12" width="4" height="30"/>
        <rect x="57" y="4" width="4" height="30"/>
        <polygon points="27,12 61,4 61,12 27,20"/>
      </g>
    </g>

    <!-- Subtle Chord labels -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <text x="185" y="325" fill="#f59e0b">C</text>
      <text x="327" y="325" fill="#f59e0b">G</text>
    </g>
  </g>
</svg>
