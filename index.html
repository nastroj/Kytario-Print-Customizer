<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Kytario Print Customizer</title>
    <meta name="description" content="A web application to process and customize Kytario songbook JSON data for printing." />
    <meta name="theme-color" content="#18181b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kytario" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:title" content="Kytario Print Customizer" />
    <meta property="og:description" content="A web application to process and customize Kytario songbook JSON data for printing." />
    <meta property="og:image" content="%BASE_URL%pwa-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%BASE_URL%pwa-512x512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kytario Print Customizer",
        "description": "A web application to process and customize Kytario songbook JSON data for printing.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All"
      }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kytario-dark-mode');
          var isDark = saved !== null ? JSON.parse(saved) : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Dedicated print page size & orientation style (dynamically updated by print customizer) -->
    <style id="kytario-print-page-setup">
      @page {
        size: A4 landscape;
        size: auto landscape;
        margin: 0 !important;
        bleed: 0mm;
        marks: none;
      }
      @page :first {
        size: A4 landscape;
        size: auto landscape;
        margin: 0 !important;
        bleed: 0mm;
        marks: none;
      }
      @media print {
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }
        @page {
          size: A4 landscape;
          size: auto landscape;
          margin: 0 !important;
          bleed: 0mm;
          marks: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
